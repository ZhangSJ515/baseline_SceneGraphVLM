[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphedit-r1"
version = "0.1.0"
description = "Executable persistent video scene-graph editing extension for SceneGraphVLM"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
graphedit-r1 = "graphedit_r1.cli:main"

[tool.setuptools]
packages = ["graphedit_r1"]
